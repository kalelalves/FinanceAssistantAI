name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FinIA.slnx

      - name: Build
        run: dotnet build FinIA.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FinIA.slnx --no-build --configuration Release

      - name: Format
        run: dotnet format FinIA.slnx --verify-no-changes
